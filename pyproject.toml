[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "numpy",
    "sip",
    "PyQt6",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Hoisted from tests/daemon/pytest.ini so that mixed invocations like
# `pytest tests/daemon tests/comparison` share one rootdir and the
# auto-asyncio mode applies to the daemon's async fixtures regardless
# of which testpaths are passed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
