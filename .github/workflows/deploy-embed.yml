# Build the in-browser embed runtime and publish it to GitHub Pages under a
# *versioned* path, so author pages pinned to a version never break when a
# newer one ships.
#
# Deploys via GitHub's native Pages pipeline (actions/deploy-pages), so the
# only repo setting is Settings → Pages → Source → "GitHub Actions" (visible by
# default — no branch to create or select). Because deploy-pages replaces the
# whole site each run, we keep previously published versions on a generated
# `embed-dist` branch, restore them before each deploy, and re-publish the
# union. (`embed-dist` is a build artifact store, force-pushed each run — it is
# NOT source history.)
#
# Layout published (VERSION comes from the repo's VERSION file):
#   https://yipihey.github.io/veusz/embed/v<VERSION>/veusz-embed.js   (+ chunks)
#   https://yipihey.github.io/veusz/embed/v<VERSION>/wasm/...          (Vello wasm)
#   https://yipihey.github.io/veusz/embed/v<VERSION>/veusz-<VERSION>-py3-none-any.whl
#
# That base URL is exactly what `veusz-embed build` (default, CDN mode) bakes
# into the page it generates.
name: Deploy embed runtime to Pages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # push the embed-dist artifact-store branch
  pages: write      # deploy to Pages
  id-token: write   # OIDC for deploy-pages

# Never run two Pages deploys at once; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Read VERSION
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build headless veusz wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pure-Python wheel: no PyQt6 / numpy / C-extensions needed to build.
          python scripts/build_embed_wheel.py

      - name: Set up Rust (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: veusz-tauri
      - name: Install wasm-bindgen CLI (pinned to the crate version)
        run: |
          # Keep the CLI in lock-step with the wasm-bindgen crate in Cargo.lock,
          # or wasm-bindgen will refuse to process the .wasm.
          WBV=$(grep -A1 '^name = "wasm-bindgen"$' veusz-tauri/Cargo.lock \
                | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "wasm-bindgen-cli $WBV"
          cargo install wasm-bindgen-cli --version "$WBV" --locked
      - name: Build Vello WASM
        run: scripts/build_paint_wasm.sh

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the local toolchain: pnpm-workspace.yaml uses the pnpm 11
          # settings form (onlyBuiltDependencies, no `packages:`), which pnpm 9
          # rejects with "packages field missing or empty".
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm 11 needs Node >= 22.13 (uses node:sqlite)
          cache: 'pnpm'
          cache-dependency-path: veusz-tauri/pnpm-lock.yaml
      - name: Build embed library
        working-directory: veusz-tauri
        run: |
          # pnpm 11 exits non-zero on the esbuild/msw build-script notice (the
          # allowlist in pnpm-workspace.yaml isn't applied here), and `pnpm run`
          # re-triggers it via its pre-run deps check. So: tolerate the install
          # notice, confirm node_modules was populated, then invoke the build
          # tools directly (bypassing `pnpm run`). esbuild's native binary ships
          # as an optional dependency, so vite builds without its postinstall.
          pnpm install --frozen-lockfile || true
          test -d node_modules/vite || { echo "::error::pnpm install failed"; exit 1; }
          node scripts/sync-wasm.mjs                              # -> public/wasm
          node_modules/.bin/vite build --config vite.embed.config.ts  # -> dist-embed/

      - name: Restore previously published versions
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads "$REPO_URL" embed-dist >/dev/null 2>&1; then
            git clone --depth 1 --branch embed-dist "$REPO_URL" site
            echo "restored existing embed-dist"
          else
            echo "no embed-dist yet — first publish"
          fi

      - name: Stage this version + live example
        run: |
          V="${{ steps.ver.outputs.version }}"
          DEST="site/embed/v${V}"
          rm -rf "$DEST"; mkdir -p "$DEST/wasm"
          # The ES module + its code-split chunks (skip .map source maps).
          find veusz-tauri/dist-embed -maxdepth 1 -name '*.js' -exec cp {} "$DEST/" \;
          # The Pyodide worker chunk (and any code-split chunks) live in
          # dist-embed/assets/. veusz-embed.js loads the worker via a relative
          # `assets/…` URL, so they must be staged too — otherwise the worker
          # 404s ("Pyodide worker error").
          if [ -d veusz-tauri/dist-embed/assets ]; then
            mkdir -p "$DEST/assets"
            find veusz-tauri/dist-embed/assets -maxdepth 1 -name '*.js' \
              -exec cp {} "$DEST/assets/" \;
          fi
          cp veusz-tauri/public/wasm/* "$DEST/wasm/"
          cp "dist/veusz-${V}-py3-none-any.whl" "$DEST/"
          # A live, self-contained example figure (fit.vsz). CDN mode → it
          # references the version assets staged above; poster is the committed
          # Qt render so the static fallback (and non-WebGPU browsers) look
          # right too.
          rm -rf site/example
          node veusz-tauri/scripts/veusz-embed.mjs build examples/fit.vsz \
            -o site/example --poster veusz-tauri/example/fit.poster.png
          # URL data-source example: a .vsz that uses `ImportFileURL("data.csv")`
          # — the JS runtime pre-fetches the CSV and re-renders on change.
          # --no-poster: render_poster has no JS to feed it the URL bytes.
          rm -rf site/url-example
          node veusz-tauri/scripts/veusz-embed.mjs build \
            veusz-tauri/example/url-demo.vsz -o site/url-example --no-poster
          cp veusz-tauri/example/url-data.csv site/url-example/data.csv
          # Per-figure viewer: figure.html?src=<.vsz URL> mounts <veusz-figure>.
          # Lets any HTML host (notably a MyST {iframe}, which sanitises inline
          # custom elements) embed a Veusz figure by iframing this page.
          cp veusz-tauri/embed-viewer.html "$DEST/figure.html"
          # Regenerate the notebook figure's inline SVG straight from its .vsz
          # with the headless Rust renderer — NO Qt, NO browser. This is the
          # whole point of the paint backends: render anywhere. It also proves
          # the pipeline in CI (the env that previously couldn't) and keeps
          # phase.svg in sync. Best-effort: on any failure the committed
          # integrations/myst-veusz/example/figures/phase.svg is used instead.
          if cargo build --release -p veusz-render-cli \
                --manifest-path veusz-tauri/Cargo.toml \
             && python -m pip install --quiet numpy \
             && PYTHON=python \
                VEUSZ_RENDER=veusz-tauri/target/release/veusz-render \
                scripts/render_vsz.sh \
                  integrations/myst-veusz/example/figures/phase.vsz \
                  integrations/myst-veusz/example/figures/phase.svg; then
            echo "regenerated phase.svg headlessly (no Qt)"
          else
            echo "::warning::headless SVG regen failed — using committed phase.svg"
          fi
          # Browser-native MyST notebook: prose + a live JupyterLite (Pyodide)
          # code cell + a live Veusz figure (via the veusz directive -> the
          # figure.html viewer above). Builds a static site; mystmd exits after
          # building. The figure's phase.vsz is staged at notebook/phase.vsz,
          # which is the URL the directive's iframe fetches.
          rm -rf site/notebook
          # BASE_URL: the notebook is served from the /veusz/notebook/ sub-path,
          # so the MyST SPA must prefix its asset/content URLs with it (else it
          # shows "incorrect BASE_URL configuration").
          if ( cd integrations/myst-veusz/example && rm -rf _build \
               && BASE_URL=/veusz/notebook npx --yes mystmd build --html ) \
             && [ -f integrations/myst-veusz/example/_build/html/index.html ]; then
            mkdir -p site/notebook
            cp -r integrations/myst-veusz/example/_build/html/. site/notebook/
            cp integrations/myst-veusz/example/figures/phase.vsz site/notebook/phase.vsz
          else
            echo "::warning::MyST notebook build failed — skipping /notebook/ this run"
          fi
          touch site/.nojekyll
          printf '%s\n' \
            '<!doctype html><meta charset=utf-8><title>Veusz embed runtime</title>' \
            '<style>body{font:15px/1.5 system-ui;max-width:680px;margin:3rem auto;padding:0 1rem}</style>' \
            '<h1>Veusz embed runtime</h1>' \
            '<p>Live examples:</p>' \
            '<ul>' \
            '<li><a href="./example/">/example/</a> &mdash; <code>fit.vsz</code> with data baked into the .vsz</li>' \
            '<li><a href="./url-example/">/url-example/</a> &mdash; <code>ImportFileURL(&quot;data.csv&quot;)</code>: the figure fetches its data from a URL at load (and re-fetches on change when <code>poll_seconds&gt;0</code>)</li>' \
            '<li><a href="./notebook/">/notebook/</a> &mdash; a browser-native <strong>MyST notebook</strong>: prose + a live JupyterLite (Pyodide) code cell + a live Veusz density figure, all client-side. Opens on a phone.</li>' \
            '</ul>' \
            '<p>Versioned runtime assets live under <code>/embed/v&lt;version&gt;/</code>.</p>' \
            > site/index.html
          ls -R site/url-example site/example "$DEST"

      - name: Persist embed-dist store branch
        working-directory: site
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          # Force-push the union (restored + this version) as a fresh single
          # commit. This branch is a generated store, not source history.
          rm -rf .git
          git init -q
          git checkout -q -b embed-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "embed v${{ steps.ver.outputs.version }}"
          git push -f "$REPO_URL" embed-dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
