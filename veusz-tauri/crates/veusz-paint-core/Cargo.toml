[package]
name = "veusz-paint-core"
version = "0.0.0"
edition = "2021"
description = "Abstract Painter trait + supporting value types for Veusz's parallel paint backends (Qt, tiny-skia, Vello). No backend deps. Mirror of veusz/paint/protocol.py."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Bulk coordinate arrays (DrawMarkers) are packed as f32 little-endian and
# base64'd in text formats — keeps large scatters small + fast to (de)serialize.
base64 = "0.22"
serde_bytes = "0.11"

[dev-dependencies]
serde_json = "1"
