[package]
name = "veusz-paint-wasm"
version = "0.0.0"
edition = "2021"
description = "wasm-bindgen wrapper around veusz-paint-vello that exposes the Veusz Scene -> PNG path in a browser. The strategic backend (plan §8 phase 4): a .vsz document can be rendered via WebGPU in a JS/TS environment with no Python and no Qt in the render path."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veusz-paint-core = { path = "../veusz-paint-core" }
# Pure-Rust Scene -> SVG (no Qt, no GPU): powers the `scene_to_svg` binding for
# true client-side vector export in the browser. We enable `text` (glyph-outline
# SVG text) but NOT `system-fonts` — fontique's discovery can't build for wasm32
# — and instead seed the same vendored Liberation Sans the canvas path uses, via
# `render_scene_to_svg_with_embedded_font`. Without this, SVG text fell back to
# the dashed placeholder in the browser.
veusz-paint-svg = { path = "../veusz-paint-svg", default-features = false, features = ["text"] }
# The shared Scene -> vello::Scene translator. We depend on this rather than
# veusz-paint-vello directly because that crate pulls in veusz-paint-text with
# system font discovery. The common crate is backend-agnostic: we inject a wasm
# TextRenderer (embedded-font veusz-paint-text) and the degenerate-image pad
# hook.
veusz-paint-vello-common = { path = "../veusz-paint-vello-common" }
# Real text layout (Parley shaping + skrifa outlines + multi-line), shared with
# the native backends. `default-features = false` drops the `system-fonts`
# feature (fontique's fontconfig/CoreText discovery, which can't run in a
# browser); parley/fontique then build std-only and we seed the engine with the
# vendored Liberation Sans via TextEngine::with_embedded_font.
veusz-paint-text = { path = "../veusz-paint-text", default-features = false }
vello = "0.3"
wgpu = "22"
peniko = "0.2"
serde_json = "1"
skrifa = "0.42"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Element", "HtmlCanvasElement", "Window",
    "GpuCanvasContext", "GpuTextureFormat",
] }
console_error_panic_hook = "0.1"
