[package]
name = "veusz-paint-text"
version = "0.0.0"
edition = "2021"
description = "Text layout + glyph-to-path conversion for Veusz paint backends. Uses Parley for layout and skrifa for glyph outline extraction; the resulting Vec<(Path, Affine)> works as input to any backend that implements veusz_paint_core::Painter."

[dependencies]
veusz-paint-core = { path = "../veusz-paint-core" }
# parley/fontique default to the `system` feature (fontconfig / CoreText /
# DirectWrite font discovery), which can't run in a browser. We turn defaults
# off here and re-enable system discovery via our own `system-fonts` feature,
# so the wasm target can build a discovery-free `std`-only parley and seed it
# with an embedded font instead.
parley = { version = "0.9", default-features = false, features = ["std"] }
fontique = { version = "0.9", default-features = false, features = ["std"] }
skrifa = "0.42"

[features]
default = ["system-fonts"]
# Native font discovery via fontique. `fontconfig-dlopen` avoids linking
# libfontconfig at build time — it dlopens the shared library at runtime if
# available, so the crate still builds on minimal containers but picks up
# system fonts when present.
system-fonts = ["parley/system", "fontique/system", "fontique/fontconfig-dlopen"]
# Back-compat alias for the old feature name.
fontconfig-dlopen = ["system-fonts"]
