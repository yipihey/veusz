[package]
name = "veusz-paint-svg"
version = "0.0.0"
edition = "2021"
description = "Scene -> SVG emitter for Veusz's parallel paint backends. Consumes the abstract Scene IR from veusz-paint-core and writes a standalone, resolution-independent SVG — the vector counterpart of veusz-paint-pdf, usable from native and (via veusz-paint-wasm) the browser with no Qt."

[dependencies]
veusz-paint-core = { path = "../veusz-paint-core" }
# Glyph layout + outline extraction, shared with the raster/PDF backends, so
# SVG text emits the same glyph outlines instead of viewer-font-dependent
# <text>. `default-features = false` keeps fontique's system-font discovery
# (which can't build on wasm32) OUT of the base `text` feature: native re-adds
# it via this crate's `system-fonts` feature (in `default`), while the wasm
# build enables `text` alone and seeds an embedded font instead (see
# `render_scene_to_svg_with_embedded_font`).
veusz-paint-text = { path = "../veusz-paint-text", optional = true, default-features = false }
base64 = "0.22"
png = "0.17"

[features]
default = ["text", "system-fonts"]
# Path-based glyph text via veusz-paint-text. Off => placeholder fallback.
# On its own (no system-fonts) this builds on wasm32 and needs an embedded font.
text = ["dep:veusz-paint-text"]
# Native font discovery (fontconfig/CoreText/DirectWrite via fontique). The
# `text?/…` form only forwards when `text` is also enabled.
system-fonts = ["veusz-paint-text?/system-fonts"]

[dev-dependencies]
serde_json = "1"
