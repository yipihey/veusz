[package]
name = "veusz-paint-vello"
version = "0.0.0"
edition = "2021"
description = "Vello (wgpu) backend for Veusz's abstract Painter trait. GPU compute rasteriser, with native (Vulkan/Metal/DX12) and WebGPU adapters. Same Scene IR input as tiny-skia and pdf-writer."

[dependencies]
veusz-paint-core = { path = "../veusz-paint-core" }
veusz-paint-text = { path = "../veusz-paint-text" }
# Bumped vello 0.3 -> 0.4 (with peniko 0.3 / wgpu 23). The Tier-2 #7
# motivation: wgpu 23 dropped the deprecated
# `maxInterStageShaderComponents` limit from its DeviceDescriptor that
# newer Chromium rejects. vello 0.4 is the cheapest upgrade that
# carries that wgpu version; staying with 0.3 also locks us out of
# peniko 0.3's typed color system.
vello = "0.4"
wgpu = "23"
peniko = "0.3"
kurbo = "0.11"
png = "0.18"
pollster = "0.4"
bytemuck = "1"
