[package]
name = "veusz-paint-vello"
version = "0.0.0"
edition = "2021"
description = "Vello (wgpu) backend for Veusz's abstract Painter trait. GPU compute rasteriser, with native (Vulkan/Metal/DX12) and WebGPU adapters. Same Scene IR input as tiny-skia and pdf-writer."

[dependencies]
veusz-paint-core = { path = "../veusz-paint-core" }
veusz-paint-text = { path = "../veusz-paint-text" }
# Shared SceneOp -> vello::Scene translator (the dispatch loop + kurbo/peniko
# conversions). This crate only supplies the native DrawText path on top.
veusz-paint-vello-common = { path = "../veusz-paint-vello-common" }
vello = "0.3"
wgpu = "22"
# peniko / kurbo are re-exported via vello; keep versions matched.
peniko = "0.2"
png = "0.18"
pollster = "0.3"
